on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Manually clone pyDataverse
        run: |
          git clone https://github.com/IQSS/pyDataverse.git /tmp/pyDataverse

      - name: Install pyDataverse from local clone
        run: |
          pip install --upgrade pip
          pip install /tmp/pyDataverse

      - name: Send repo to Dataverse
        uses: IQSS/dataverse-uploader@v1.6
        with:
          DATAVERSE_TOKEN: ${{ secrets.DATAVERSE_TOKEN }}
          DATAVERSE_SERVER: https://dataverse.harvard.edu
          DATAVERSE_DATASET_DOI: doi:10.7910/DVN/63YPGN
          DELETE: True
          PUBLISH: False
